<!doctype html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Ivalshakthi </title>
    <meta name="description" content="Mobilekit HTML Mobile UI Kit">
    <meta name="keywords" content="bootstrap 4, mobile template, cordova, phonegap, mobile, html" />
    <link rel="icon" type="image/png" href="assets/img/favicon.png" sizes="32x32">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/icon/192x192.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Select placeholders match the Name and Address placeholders */
        body:not(.dark-mode-active) select.form-control.is-placeholder {
            color: #6c757d !important;
        }

        /* Input text color in normal mode */
        body:not(.dark-mode-active) .form-control,
        body:not(.dark-mode-active) textarea.form-control,
        body:not(.dark-mode-active) select.form-control {
            color: #000000 !important;
        }

        /* Active date input bright white text in dark mode */
        body.dark-mode-active #currentDateInput,
        body.dark-mode-active .form-control,
        body.dark-mode-active textarea.form-control,
        body.dark-mode-active select.form-control {
            color: #ffffff !important;
            font-weight: 500;
            opacity: 1;
        }

        body.dark-mode-active select.form-control.is-placeholder {
            color: #6c757d !important;
        }

        body:not(.dark-mode-active) .form-group.boxed input.form-control:-webkit-autofill,
        body:not(.dark-mode-active) .form-group.boxed textarea.form-control:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #ffffff inset !important;
            -webkit-text-fill-color: #000000 !important;
        }

        body.dark-mode-active .form-group.boxed input.form-control,
        body.dark-mode-active .form-group.boxed textarea.form-control {
            background-color: #1B283B !important;
        }
        body.dark-mode-active .form-group.boxed input.form-control:-webkit-autofill,
        body.dark-mode-active .form-group.boxed textarea.form-control:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #1B283B inset !important;
            -webkit-text-fill-color: #ffffff !important;
        }

        /* Select option colors inside dropdown */
        body.dark-mode-active select.form-control option {
            background-color: #0c1624 !important;
            color: #ffffff !important;
        }
        body.dark-mode-active select.form-control option[disabled] {
            color: #8195a6 !important;
        }

        /* Form labels follow theme */
        body:not(.dark-mode-active) .form-group label {
            color: #333333 !important;
        }
        body.dark-mode-active .form-group label {
            color: #ffffff !important;
        }

        body.dark-mode-active #customerCareLabel {
            color: #ffffff !important;
        }

        #myForm .custom-radio .custom-control-input:not(:checked) ~ .custom-control-label::before {
            border: 2px solid #64748b !important;
            background: #ffffff !important;
        }

        body.dark-mode-active #myForm .custom-radio .custom-control-input:not(:checked) ~ .custom-control-label::before {
            border-color: #cbd5e1 !important;
            background: transparent !important;
        }
    </style>
</head>

<body class="bg-white">

    <!-- loader -->
    <div id="loader">
        <div class="spinner-border text-primary" role="status"></div>
    </div>
    <!-- * loader -->

    <!-- App Capsule -->
    <div id="appCapsule" class="pt-0 pb-0">

        <div class="section mt-3 mb-3">
            <div class="card">
                <div class="card-body d-flex justify-content-between align-items-end">
                    <div>
                        <h5 class="card-title mb-0 d-flex align-items-center justify-content-between">
                            🎉 Welcome 🎉
                        </h5>
                    </div>
                    <div class="custom-control custom-switch">
                        <input type="checkbox" class="custom-control-input dark-mode-switch" id="darkmodeswitch">
                        <label class="custom-control-label" for="darkmodeswitch"></label>
                    </div>
                </div>
            </div>
        </div>

        <div class="login-form mt-1">
            <div class="section">
                <img src="assets/img/logo-2.png" alt="image" class="form-image">
            </div>

            <div class="section mt-3 mb-3">
                <div class="card">
                    <div class="card-body d-flex justify-content-between align-items-end">
                        <div>
                            <!-- Title updated from E-book Subscription Form to Subscription Form -->
                            <h5 class="card-title mb-0 d-flex align-items-center justify-content-between">
                                Subscription Form
                            </h5>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section mt-1 mb-5">
                <form id="myForm">

                    <div class="form-group boxed">
                        <label for="nameInput" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333; text-align: left; width: 100%;">Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="nameInput" class="form-control" placeholder="Name" required>
                        </div>
                    </div>

                    <div class="form-group boxed">
                        <label for="mobileInput" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333; text-align: left; width: 100%;">Mobile Number</label>
                        <div class="input-wrapper">
                            <input type="text" id="mobileInput" class="form-control" placeholder="Mobile Number" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
                        </div>
                    </div>

                    <div class="form-group boxed">
                        <label for="addressInput" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333; text-align: left; width: 100%;">Address</label>
                        <div class="input-wrapper">
                            <textarea class="form-control" id="addressInput" placeholder="Book Delivery Address" rows="3" style="height: auto; min-height: 80px;" required></textarea>
                        </div>
                    </div>

                    <div class="form-group boxed">
                        <label for="currentDateInput" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333; text-align: left; width: 100%;">Subscription Start Date</label>
                        <div class="input-wrapper">
                            <input type="text" id="currentDateInput" class="form-control" readonly>
                        </div>
                    </div>

                    <!-- Book Type Selection -->
                    <div class="form-group boxed">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; text-align: left; width: 100%;">Book Type </label>
                        <div class="input-wrapper" style="display: flex; flex-wrap: nowrap; align-items: center; gap: 16px;">
                            <div class="custom-control custom-radio">
                                <input type="radio" id="bookTypeEbook" class="custom-control-input" name="bookType" value="E-Book" data-qr="assets/img/qrcode.jpeg" required>
                                <label class="custom-control-label" for="bookTypeEbook">Digital (E-Book)</label>
                            </div>
                            <div class="custom-control custom-radio">
                                <input type="radio" id="bookTypeHardcopy" class="custom-control-input" name="bookType" value="Hard Copy (By Post)" data-qr="assets/img/qrcode.jpeg" required>
                                <label class="custom-control-label" for="bookTypeHardcopy">Hard Copy (By Post)</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group boxed">
                        <label for="subscriptionPlan" style="display: block; margin-bottom: 8px; font-weight: 600; text-align: left; width: 100%;">Subscription Plan</label>
                        <div class="input-wrapper">
                            <input type="text" class="form-control" id="subscriptionPlan" placeholder="Select Book Type" readonly disabled>
                        </div>
                    </div>


                    <div class="form-button-group" style="flex-direction: column;">
                        <button type="submit" id="otpBtn" class="btn btn-primary btn-block btn-lg">
                            Subscribe
                        </button>
                        <p style="text-align: center; margin: 12px 0 0; font-size: 15px; font-weight: 600; color: #333;"><strong id="customerCareLabel" style="font-weight: 700; color: #000000;">Customer Care:</strong><a href="tel:7373027775" style="margin-left: 6px; font-size: inherit; font-weight: inherit;">73730 27775</a></p>
                    </div>
                </form>

                <div class="mt-4">
                    <div class="card">
                        <img src="assets/img/book2.jpeg" class="card-img-top" alt="Book Image 2" style="border-radius: 10px;">
                    </div>
                </div>
            </div>

        </div>

    </div>
    <!-- * App Capsule -->

    <!-- app footer -->
    <div class="appFooter">
        <h3>Share and Spread our Community.</h3>

        <div class="mt-2">
            <a href="https://www.facebook.com/share/p/1bN6yRHX5f/" class="btn btn-icon btn-sm btn-facebook" target="_blank" rel="noopener noreferrer">
                <ion-icon name="logo-facebook"></ion-icon>
            </a>

            <a href="https://www.instagram.com/lval_shakthi_magazine?stkn=OGRpMDYwZmdwMXp5" class="btn btn-icon btn-sm btn-instagram" target="_blank" rel="noopener noreferrer">
                <ion-icon name="logo-instagram"></ion-icon>
            </a>

            <a href="https://wa.me/917373027775" class="btn btn-icon btn-sm btn-whatsapp" target="_blank" rel="noopener noreferrer">
                <ion-icon name="logo-whatsapp"></ion-icon>
            </a>
            <a href="#" class="btn btn-icon btn-sm btn-secondary goTop">
                <ion-icon name="arrow-up-outline"></ion-icon>
            </a>
        </div>
    </div>
    <!-- * app footer -->

    <!-- Js Files -->
    <script src="assets/js/lib/jquery-3.4.1.min.js"></script>
    <script src="assets/js/lib/popper.min.js"></script>
    <script src="assets/js/lib/bootstrap.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.0.0/dist/ionicons/ionicons.js"></script>
    <script src="assets/js/plugins/owl-carousel/owl.carousel.min.js"></script>
    <script src="assets/js/plugins/jquery-circle-progress/circle-progress.min.js"></script>
    <script src="assets/js/base.js"></script>

    <script>
        // Set dynamic today's date
        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const yyyy = today.getFullYear();
        document.getElementById("currentDateInput").value = `${dd}-${mm}-${yyyy}`;

        // Manage placeholder color class for select inputs
        function updateSelectPlaceholder(selectEl) {
            if (!selectEl.value) {
                selectEl.classList.add("is-placeholder");
            } else {
                selectEl.classList.remove("is-placeholder");
            }
        }

        document.querySelectorAll("select.form-control").forEach(select => {
            updateSelectPlaceholder(select);
            select.addEventListener("change", function () {
                updateSelectPlaceholder(this);
            });
        });

        const bookTypeRadios = document.querySelectorAll('input[name="bookType"]');
        const subscriptionPlanInput = document.getElementById("subscriptionPlan");
        const plansByBookType = {
            "E-Book": { value: "Digital One Year (E-Magazine Access)", amount: 144 },
            "Hard Copy (By Post)": { value: "One Year (12 Issues)", amount: 299 }
        };

        function updateSubscriptionPlan(bookType) {
            const plan = plansByBookType[bookType];
            subscriptionPlanInput.value = plan ? `${plan.value} - ₹${plan.amount}` : "";
            subscriptionPlanInput.dataset.amount = plan ? plan.amount : "";
            subscriptionPlanInput.disabled = !plan;
        }

        bookTypeRadios.forEach(radio => {
            radio.addEventListener("change", function () {
                updateSubscriptionPlan(this.value);
            });
        });

        // Form Validation & Submission
        document.getElementById("myForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const nameInput = document.getElementById("nameInput");
            const mobileInput = document.getElementById("mobileInput");
            const addressInput = document.getElementById("addressInput");
            const bookTypeInput = document.querySelector('input[name="bookType"]:checked');

            const name = nameInput.value.trim();
            const mobile = mobileInput.value.trim();
            const address = addressInput.value.trim();
            const bookType = bookTypeInput ? bookTypeInput.value : "";
            const subPlan = subscriptionPlanInput.value;

            // 1. Name Validation
            if (!name || name.length < 2) {
                Swal.fire({
                    icon: "warning",
                    title: "Invalid Name",
                    text: "Please enter your Name (at least 2 characters)."
                }).then(() => nameInput.focus());
                return;
            }

            // 2. Mobile Number Validation
            const mobileRegex = /^[6-9]\d{9}$/;
            if (!mobile || !mobileRegex.test(mobile)) {
                Swal.fire({
                    icon: "warning",
                    title: "Invalid Mobile Number",
                    text: "Please enter a valid 10-digit Mobile Number."
                }).then(() => mobileInput.focus());
                return;
            }

            // 3. Address Validation
            if (!address || address.length < 5) {
                Swal.fire({
                    icon: "warning",
                    title: "Invalid Address",
                    text: "Please enter a complete Address (at least 5 characters)."
                }).then(() => addressInput.focus());
                return;
            }

            // 4. Book Type Validation
            if (!bookType) {
                Swal.fire({
                    icon: "warning",
                    title: "Select Book Type",
                    text: "Please select a Book Type (E-Book or Hard Copy)."
                }).then(() => document.getElementById("bookTypeEbook").focus());
                return;
            }

            if (!subPlan) {
                Swal.fire({
                    icon: "warning",
                    title: "Select Subscription Plan",
                    text: "Please select a Subscription Plan."
                }).then(() => subscriptionPlanInput.focus());
                return;
            }

            const qrImageSrc = bookTypeInput.getAttribute("data-qr") || "assets/img/qrcode.jpeg";
            const amount = Number(subscriptionPlanInput.dataset.amount);
            const formattedAmount = new Intl.NumberFormat("en-IN", {
                style: "currency",
                currency: "INR",
                maximumFractionDigits: 0
            }).format(amount);

            // Payment popup uses the selected book type and plan amount.
            Swal.fire({
                title: "Payment",
                html: `
                    <div style="text-align: center; font-size: 14px; margin-top: 5px;">
                        <div style="background: #f4f6f9; padding: 12px; border-radius: 8px; margin-bottom: 15px; color: #333;">
                            <p style="margin: 0 0 6px 0; font-weight: bold; color: #1e293b;">Scan QR Code to Pay</p>
                            <img src="${qrImageSrc}" alt="Payment QR Code" onerror="this.onerror=null;this.src='assets/img/qrcode.jpeg';" style="width: 170px; max-width: 100%; height: auto; border-radius: 8px; border: 1px solid #cbd5e1; margin: 8px auto; display: block;">
                            <p style="margin: 6px 0 2px 0; font-size: 13px; color: #0284c7; font-weight: 600;">Type: ${bookType}</p>
                            <p style="margin: 2px 0 4px 0; font-size: 13px; color: #2563eb; font-weight: 600;">Plan: ${subPlan}</p>
                            <p style="margin: 0 0 4px 0; font-size: 16px; font-weight: 700; color: #1e293b;">Amount to Pay: ${formattedAmount}</p>
                        </div>
                        <div style="text-align: center; background: #fff3cd; border: 1px solid #ffca2c; border-radius: 6px; padding: 12px; color: #664d03; font-size: 14px; font-weight: 600;">
                            Once payment is completed, please share the payment screenshot via WhatsApp to <a href="https://wa.me/917373027775" target="_blank" rel="noopener noreferrer" style="font-weight: 700; color: #0b5ed7;">73730 27775</a>.
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: "Payment Done",
                cancelButtonText: "Cancel",
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: "Thank You!",
                        text: "Please share your payment screenshot via WhatsApp to 73730 27775 for " + bookType + " - " + subPlan + ".",
                        icon: "success"
                    }).then(() => {
                        document.getElementById("myForm").reset();
                        document.getElementById("currentDateInput").value = `${dd}-${mm}-${yyyy}`;
                        updateSubscriptionPlan("");
                        document.querySelectorAll("select.form-control").forEach(updateSelectPlaceholder);
                    });
                }
            });
        });
    </script>

</body>

</html>
