<!doctype html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Ivalshakthi </title>
    <meta name="description" content="Mobilekit HTML Mobile UI Kit">
    <meta name="keywords" content="bootstrap 4, mobile template, cordova, phonegap, mobile, html" />
    <link rel="icon" type="image/png" href="assets/img/favicon.png" sizes="32x32">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/icon/192x192.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- <link rel="manifest" href="__manifest.json"> -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Select placeholder styling to match Name/Mobile placeholders */
        select.form-control.is-placeholder {
            color: #8195a6 !important;
        }
        body:not(.dark-mode-active) select.form-control.is-placeholder {
            color: #6c757d !important;
        }

        /* Active date input bright white text in dark mode */
        body.dark-mode-active #currentDateInput {
            color: #ffffff !important;
            font-weight: 500;
            opacity: 1;
        }

        /* Select option colors inside dropdown */
        body.dark-mode-active select.form-control option {
            background-color: #0c1624 !important;
            color: #ffffff !important;
        }
        body.dark-mode-active select.form-control option[disabled] {
            color: #8195a6 !important;
        }
    </style>
</head>

<body class="bg-white">

    <!-- loader -->
    <div id="loader">
        <div class="spinner-border text-primary" role="status"></div>
    </div>
    <!-- * loader -->


    <!-- App Capsule -->
    <div id="appCapsule" class="pt-0 pb-0">

        <div class="section mt-3 mb-3">
            <div class="card">
                <div class="card-body d-flex justify-content-between align-items-end">
                    <div>
                        <h5 class="card-title mb-0 d-flex align-items-center justify-content-between">
                            🎉 Welcome 🎉
                        </h5>
                    </div>
                    <div class="custom-control custom-switch">
                        <input type="checkbox" class="custom-control-input dark-mode-switch" id="darkmodeswitch">
                        <label class="custom-control-label" for="darkmodeswitch"></label>
                    </div>

                </div>
            </div>
        </div>

        <div class="login-form mt-1">
            <div class="section">
                <img src="assets/img/sample/photo/vector4.png" alt="image" class="form-image">
            </div>
           
            <div class="section mt-3 mb-3">
                <div class="card">
                    <div class="card-body d-flex justify-content-between align-items-end">
                        <div>
                            <h5 class="card-title mb-0 d-flex align-items-center justify-content-between">
                             E-book Subscription Form
                            </h5>
                        </div>

                    </div>
                </div>
            </div>

            <div class="section mt-1 mb-5">
                <form id="myForm">

                    <div class="form-group boxed">
                        <div class="input-wrapper">
                            <input type="text" id="nameInput" class="form-control" placeholder="Name" required>
                        </div>
                    </div>

                    <div class="form-group boxed">
                        <div class="input-wrapper">
                            <input type="text" id="mobileInput" class="form-control" placeholder="Mobile Number" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
                        </div>
                    </div>

                    <div class="form-group boxed">
                        <div class="input-wrapper">
                            <textarea class="form-control" id="addressInput" placeholder="Address" rows="3" style="height: auto; min-height: 80px;" required></textarea>
                        </div>
                    </div>

                    <div class="form-group boxed">
                        <div class="input-wrapper">
                            <input type="text" id="currentDateInput" class="form-control" readonly>
                        </div>
                    </div>

                    <div class="form-group boxed">
                        <div class="input-wrapper">
                            <select class="form-control custom-select" id="bookType" required>
                                <option value="" disabled selected>Select Book Type</option>
                                <option value="E-book" data-price="100">E-book</option>
                                <option value="Offline Book" data-price="200">Offline Book</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group boxed">
                        <div class="input-wrapper">
                            <select class="form-control custom-select" id="subscriptionPlan" required>
                                <option value="" disabled selected>Select Subscription Plan</option>
                                <option value="One Year - ₹299">One Year (12 Issues) - ₹299</option>
                                <option value="Digital - ₹144">Digital (E-Magazine Access) - ₹144</option>
                                <option value="Per Month - ₹30">Per Month (Monthly Subscription) - ₹30</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-button-group">
                        <button type="submit" id="otpBtn" class="btn btn-primary btn-block btn-lg">
                           Subscribe
                        </button>
                    </div>

                </form>

                <!-- 2 Images under the form (vertical format matching form width) -->
                <div class="mt-4">
                    <div class="card mb-3">
                        <img src="assets/img/book1.jpeg" class="card-img-top" alt="Book Image 1" style="border-radius: 10px;">
                    </div>
                    <div class="card">
                        <img src="assets/img/book2.jpeg" class="card-img-top" alt="Book Image 2" style="border-radius: 10px;">
                    </div>
                </div>
            </div>

        </div>

    </div>
    <!-- * App Capsule -->

    <!-- app footer -->
    <div class="appFooter">


        <h3>Share and Spread our Community.</h3>


        <div class="mt-2">
            <a href="javascript:;" class="btn btn-icon btn-sm btn-facebook">
                <ion-icon name="logo-facebook"></ion-icon>
            </a>

            <a href="javascript:;" class="btn btn-icon btn-sm btn-instagram">
                <ion-icon name="logo-instagram"></ion-icon>
            </a>

            <a href="javascript:;" class="btn btn-icon btn-sm btn-whatsapp">
                <ion-icon name="logo-whatsapp"></ion-icon>
            </a>
            <a href="#" class="btn btn-icon btn-sm btn-secondary goTop">
                <ion-icon name="arrow-up-outline"></ion-icon>
            </a>
        </div>

    </div>
    <!-- * app footer -->

    <!-- ///////////// Js Files ////////////////////  -->
    <!-- Jquery -->
    <script src="assets/js/lib/jquery-3.4.1.min.js"></script>
    <!-- Bootstrap-->
    <script src="assets/js/lib/popper.min.js"></script>
    <script src="assets/js/lib/bootstrap.min.js"></script>
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@5.0.0/dist/ionicons/ionicons.js"></script>
    <!-- Owl Carousel -->
    <script src="assets/js/plugins/owl-carousel/owl.carousel.min.js"></script>
    <!-- jQuery Circle Progress -->
    <script src="assets/js/plugins/jquery-circle-progress/circle-progress.min.js"></script>
    <!-- Base Js File -->
    <script src="assets/js/base.js"></script>

    <script>
        // Set dynamic today's date
        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const yyyy = today.getFullYear();
        document.getElementById("currentDateInput").value = `${dd}-${mm}-${yyyy}`;

        // Manage placeholder color class for select inputs
        function updateSelectPlaceholder(selectEl) {
            if (!selectEl.value) {
                selectEl.classList.add("is-placeholder");
            } else {
                selectEl.classList.remove("is-placeholder");
            }
        }

        document.querySelectorAll("select.form-control").forEach(select => {
            updateSelectPlaceholder(select);
            select.addEventListener("change", function () {
                updateSelectPlaceholder(this);
            });
        });

        // Form Validation & Submission
        document.getElementById("myForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const nameInput = document.getElementById("nameInput");
            const mobileInput = document.getElementById("mobileInput");
            const addressInput = document.getElementById("addressInput");
            const bookTypeSelect = document.getElementById("bookType");
            const subPlanSelect = document.getElementById("subscriptionPlan");

            const name = nameInput.value.trim();
            const mobile = mobileInput.value.trim();
            const address = addressInput.value.trim();
            const bookType = bookTypeSelect.value;
            const subPlan = subPlanSelect.value;

            // 1. Name Validation
            if (!name || name.length < 2) {
                Swal.fire({
                    icon: "warning",
                    title: "Invalid Name",
                    text: "Please enter your Name (at least 2 characters)."
                }).then(() => nameInput.focus());
                return;
            }

            // 2. Mobile Number Validation (10 digits starting with 6-9)
            const mobileRegex = /^[6-9]\d{9}$/;
            if (!mobile || !mobileRegex.test(mobile)) {
                Swal.fire({
                    icon: "warning",
                    title: "Invalid Mobile Number",
                    text: "Please enter a valid 10-digit Mobile Number."
                }).then(() => mobileInput.focus());
                return;
            }

            // 3. Address Validation
            if (!address || address.length < 5) {
                Swal.fire({
                    icon: "warning",
                    title: "Invalid Address",
                    text: "Please enter a complete Address (at least 5 characters)."
                }).then(() => addressInput.focus());
                return;
            }

            // 4. Book Type Validation
            if (!bookType) {
                Swal.fire({
                    icon: "warning",
                    title: "Select Book Type",
                    text: "Please select a Book Type (E-book or Offline Book)."
                }).then(() => bookTypeSelect.focus());
                return;
            }

            // 5. Subscription Plan Validation
            if (!subPlan) {
                Swal.fire({
                    icon: "warning",
                    title: "Select Subscription Plan",
                    text: "Please select a Subscription Plan."
                }).then(() => subPlanSelect.focus());
                return;
            }

            // Payment Transaction Popup with QR Code
            Swal.fire({
                title: "Subscription Payment",
                html: `
                    <div style="text-align: center; font-size: 14px; margin-top: 5px;">
                        <div style="background: #f4f6f9; padding: 12px; border-radius: 8px; margin-bottom: 15px; color: #333;">
                            <p style="margin: 0 0 6px 0; font-weight: bold; color: #1e293b;">Scan QR Code to Pay</p>
                            <img src="assets/img/qrcode.jpeg" alt="Payment QR Code" style="width: 170px; max-width: 100%; height: auto; border-radius: 8px; border: 1px solid #cbd5e1; margin: 8px auto; display: block;">
                            <p style="margin: 6px 0 4px 0; font-size: 13px; color: #2563eb; font-weight: 600;">Plan: ${subPlan}</p>
                            <p style="margin: 0 0 4px 0;"><strong>UPI ID:</strong> ivalshakthi@upi</p>
                            <p style="margin: 0; font-size: 12px; color: #64748b;">Contact: +91 90034 86017 / 9944562659</p>
                        </div>
                        <div style="text-align: left;">
                            <label style="font-weight: 600; display: block; margin-bottom: 5px; color: #333;">Transaction ID / UTR Number:</label>
                            <input id="swal-tx-id" class="swal2-input" placeholder="e.g. 423156789012" style="margin: 0; width: 100%; box-sizing: border-box; color: #000;">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: "Submit Payment",
                cancelButtonText: "Cancel",
                preConfirm: () => {
                    const txId = document.getElementById("swal-tx-id").value.trim();
                    if (!txId) {
                        Swal.showValidationMessage("Please enter your Transaction ID / UTR Number");
                        return false;
                    }
                    return txId;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: "Subscription Successful!",
                        text: "Your Transaction ID (" + result.value + ") for " + subPlan + " has been submitted successfully. We will verify and activate your subscription.",
                        icon: "success"
                    }).then(() => {
                        document.getElementById("myForm").reset();
                        document.getElementById("currentDateInput").value = `${dd}-${mm}-${yyyy}`;
                        document.querySelectorAll("select.form-control").forEach(updateSelectPlaceholder);
                    });
                }
            });
        });
    </script>


</body>

</html>
